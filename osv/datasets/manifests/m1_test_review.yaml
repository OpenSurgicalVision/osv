# RFC 0001 (M1), section 1, open question: CholecSeg8k labels two instrument classes
# only. Test frames that show another instrument (clipper, irrigator, scissors, ...)
# have no class for it, and it may be labelled as background or as tissue. A person looks
# at every sheet of `python -m osv.eval.m1 review` and lists here what to leave out of
# the test; `osv.eval.m1 test` refuses to run until status is REVIEWED.
#
# excluded_clips: clip ids as on the sheets, e.g. video09_00160 (all its frames)
# excluded_frames: single frames, e.g. video09_00160/frame_175
status: REVIEWED
reviewer: AleksandrStef (project owner)
date: 2026-10-25
excluded_clips: []
excluded_frames: []
notes: >-
  All 37 test clips (2 960 frames of video09, 17, 20, 24, 28, 37, 55) were looked at on the
  sheets of `osv.eval.m1 review`, by the first, middle and last frame of each clip. No
  instrument without its own class was seen, so nothing is excluded.
