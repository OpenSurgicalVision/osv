# Build config for the M5 desmoking data (synthetic smoke over CholecT50). APPROVED by the
# project owner (R0) on 2026-10-19 in the working session, with clean.haze_max chosen from
# the calibration recorded below; relayed by the agent that drafted it, the owner's PR
# approval is the record.

name: smoke_m5
status: APPROVED

size: [854, 480]        # width, height of every written frame and smoke layer

clean:
  stride: 10            # every 10th frame of a video (CholecT50 is 1 fps: one per 10 s)
  haze_max: 0.28        # frames with osv.datasets.cholect50.haze_score above this are not clean
  calibration:          # `smoke_m5 calibrate`, 500 strided frames of all 50 videos, 2026-10-19
    quantiles: {p5: 0.0941, p10: 0.1137, p25: 0.1608, p50: 0.2118, p75: 0.2745, p90: 0.3451, p95: 0.4196}
    decision: >
      The owner found no visible smoke in deciles 6 and 7 (scores up to about 0.30), so the
      threshold sits a little below the top of decile 7: about 77 % of strided
      frames stay clean. Deciles 8-9 were not judged; anything above 0.28 is rejected.

real_smoke:             # rejected (haze > haze_max) real frames kept per split, hazy-est first
  train: null           # all: the unpaired smoky domain for CycleGAN
  val: 200              # qualitative / no-reference checks during development
  test: 200             # haze-drop indicator on the held-out split (R-25 counter)

eval_pairs:
  splits: [val, test]   # fixed pairs, regenerated bit-for-bit; train pairs are made on the fly
  per_clean_frame: 1
  seed: 20261019
