stages:
  cholecseg8k_convert:
    # R-23: the raw archive is never staged inside the repo (never data/raw/,
    # never committed) — it is downloaded per osv/datasets/manifests/cholecseg8k.yaml
    # into a working directory outside git, checksum-verified there, and its
    # local path passed in via the CHOLECSEG8K_RAW_ZIP environment variable at
    # `dvc repro` time (read in Python by osv/datasets/cholecseg8k.py, not
    # shell-expanded here, so this cmd is identical on any OS/shell). This
    # keeps the pipeline definition reproducible and text-only while never
    # requiring an agent session to write data bytes into the repository tree.
    cmd: python -m osv.datasets.cholecseg8k --out data/processed/cholecseg8k
    deps:
      - osv/datasets/cholecseg8k.py
      - osv/datasets/manifests/cholecseg8k.yaml
    outs:
      - data/processed/cholecseg8k
  smoke_m5_build:
    # M5 desmoking data (osv/datasets/smoke_m5.py). Inputs stay outside the repo and are
    # read in Python, not shell-expanded: CHOLECT50_RAW_ZIP (or CHOLECT50_DIR) and
    # OSV_BLENDER_SMOKE_DIR. All three manifests below must be APPROVED (R-23).
    cmd: python -m osv.datasets.smoke_m5 build --out data/processed/smoke_m5
    deps:
      - osv/augment/smoke.py
      - osv/datasets/blender_smoke.py
      - osv/datasets/cholect50.py
      - osv/datasets/smoke_m5.py
      - osv/datasets/manifests/blender_smoke.yaml
      - osv/datasets/manifests/cholect50.yaml
      - osv/datasets/manifests/smoke_m5.yaml
    outs:
      - data/processed/smoke_m5
